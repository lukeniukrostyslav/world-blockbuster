name: Build Russian EPUB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build EPUB
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, zipfile
          from xml.sax.saxutils import escape

          root = Path(".")
          chapters = sorted((root / "chapters").glob("*.md"), key=lambda p: int(re.match(r"^(\d+)", p.name).group(1)))
          if len(chapters) != 36:
              raise SystemExit(f"Expected 36 chapters, found {len(chapters)}")
          ep = root / "EPILOGUE_SECOND_ROUTE.md"
          if not ep.exists():
              raise SystemExit("Missing epilogue")

          def render(md, label):
              parts = re.split(r"\n\s*\n", md.strip())
              out = [f"<h1>{escape(label)}</h1>"]
              for p in parts:
                  p = p.strip()
                  if not p:
                      continue
                  p = p.replace("**Конец книги первой.**", "<strong>Конец книги первой.</strong>")
                  if p.startswith("**") and p.endswith("**"):
                      out.append("<p class='end'><strong>" + escape(p[2:-2]) + "</strong></p>")
                  else:
                      out.append("<p>" + escape(p).replace("&lt;strong&gt;", "<strong>").replace("&lt;/strong&gt;", "</strong>") + "</p>")
              return "\n".join(out)

          out = root / "world-blockbuster-russian.epub"
          with zipfile.ZipFile(out, "w") as z:
              z.writestr("mimetype", "application/epub+zip", compress_type=zipfile.ZIP_STORED)
              z.writestr("META-INF/container.xml", '''<?xml version="1.0" encoding="UTF-8"?>
          <container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
            <rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles>
          </container>''')
              z.writestr("OEBPS/style.css", "body{font-family:serif;line-height:1.5;margin:8%;}h1{text-align:center;margin:2em 0 1em;}p{text-indent:1.25em;margin:0 0 .8em;orphans:2;widows:2;}p.end{text-align:center;text-indent:0;margin-top:3em;}")
              manifest = ['<item id="css" href="style.css" media-type="text/css"/>']
              spine = []
              nav = []
              files = [(f"ch{i:02d}", p, f"Глава {i}") for i,p in enumerate(chapters,1)] + [("epilogue", ep, "Эпилог")]
              for i,(fid,p,label) in enumerate(files):
                  href = f"text/{fid}.xhtml"
                  manifest.append(f'<item id="{fid}" href="{href}" media-type="application/xhtml+xml"/>')
                  spine.append(f'<itemref idref="{fid}"/>')
                  nav.append(f'<li><a href="{href}">{escape(label)}</a></li>')
                  body = render(p.read_text(encoding="utf-8"), label)
                  xhtml = f'''<?xml version="1.0" encoding="UTF-8"?>
          <html xmlns="http://www.w3.org/1999/xhtml" lang="ru"><head><title>{escape(label)}</title><link rel="stylesheet" href="../style.css"/></head><body>{body}</body></html>'''
                  z.writestr(href, xhtml)
              opf = f'''<?xml version="1.0" encoding="UTF-8"?>
          <package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="book-id" xml:lang="ru">
          <metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="book-id">world-blockbuster-russian-2026</dc:identifier><dc:title>Дом границ</dc:title><dc:language>ru</dc:language><dc:creator>Rostyslav Lukeniuk</dc:creator><meta property="dcterms:modified">2026-09-23T00:00:00Z</meta></metadata>
          <manifest>{''.join(manifest)}<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/></manifest>
          <spine>{''.join(spine)}</spine></package>'''
              z.writestr("OEBPS/content.opf", opf)
              z.writestr("OEBPS/nav.xhtml", f'''<?xml version="1.0" encoding="UTF-8"?>
          <html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="ru"><head><title>Содержание</title></head><body><nav epub:type="toc"><h1>Содержание</h1><ol>{''.join(nav)}</ol></nav></body></html>''')
          print(out)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: world-blockbuster-russian-epub
          path: world-blockbuster-russian.epub
